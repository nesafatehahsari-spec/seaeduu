P.tx.forEach((t,i)=>S.ans['j'+i]=[{},{}]);P.adj.forEach((t,i)=>S.ans['a'+i]=[{},{}])}
function gradeTx(ents,exp){const st=ents.filter(e=>e.a&&e.v>0),used=[],miss=[];let n=0,v=0,p=0;const fb=[],er=[];
